name: CI / Quality & Compliance Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Test, Lint & Validate OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Validate OpenAPI Schema Generation
        run: |
          python -c "from app.main import app; import json; spec = app.openapi(); print(f'Successfully generated OpenAPI spec with {len(spec[\"paths\"])} routes.')"

