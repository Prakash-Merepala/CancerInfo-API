name: CI / Quality & Compliance Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Python 3.11 Runtime, Quality & OpenAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Clean repository checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 from .python-version
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Verify Python version
        run: |
          python --version

      - name: Install dependencies from committed reproducible lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --require-hashes -r requirements.txt

      - name: Verify dependency graph consistency
        run: |
          python -m pip check

      - name: Run pytest test suite with warnings visible
        run: |
          python -m pytest tests/ -v -ra -W default

      - name: Validate OpenAPI schema generation smoke test
        run: |
          python -c "from app.main import app; import json; spec = app.openapi(); print(f'OpenAPI OK: {len(spec[\"paths\"])} routes generated successfully.')"

      - name: Build Docker image
        run: |
          docker build -t cancerinfo-api:test .

      - name: Verify Python version inside built Docker image
        run: |
          docker run --rm cancerinfo-api:test python --version

      - name: Run OpenAPI import smoke test inside built Docker image
        run: |
          docker run --rm cancerinfo-api:test python -c "from app.main import app; spec = app.openapi(); print(f'Docker Container OpenAPI OK: {len(spec[\"paths\"])} paths')"
