name: CI / Quality & Compliance Pipeline

on:
  push:
    branches: ["main", "master", "fix/CIAPI-L*", "CIAPI-L*"]
  pull_request:
    branches: ["main", "master", "launch_blockers"]

jobs:
  test-and-verify:
    name: Python 3.11 Runtime, PostgreSQL Migrations & Container Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cancerinfo_user
          POSTGRES_PASSWORD: cancerinfo_password
          POSTGRES_DB: cancerinfo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clean repository checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 from .python-version
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Verify Python version
        run: |
          python --version

      - name: Install dependencies from committed reproducible lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --require-hashes -r requirements.txt

      - name: Verify dependency graph consistency
        run: |
          python -m pip check

      - name: Run pytest test suite (SQLite coverage)
        run: |
          python -m pytest tests/ -v -ra -W default

      - name: Prepare isolated PostgreSQL test database
        run: |
          until pg_isready -h localhost -p 5432 -U cancerinfo_user; do
            echo "Waiting for PostgreSQL service container..."
            sleep 1
          done
          PGPASSWORD=cancerinfo_password psql -h localhost -U cancerinfo_user -d cancerinfo_test -c "CREATE DATABASE cancerinfo_pytest;"

      - name: Run migration, bootstrap & legacy tests against live PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://cancerinfo_user:cancerinfo_password@localhost:5432/cancerinfo_pytest
        run: |
          python -m pytest tests/test_migrations.py tests/test_bootstrap.py -v -ra -W default

      - name: Validate OpenAPI schema generation smoke test
        run: |
          python -c "from app.main import app; import json; spec = app.openapi(); print(f'OpenAPI OK: {len(spec[\"paths\"])} routes generated successfully.')"

      - name: Validate PostgreSQL migrations, drift check, and bootstrap CLI
        env:
          DATABASE_URL: postgresql+psycopg2://cancerinfo_user:cancerinfo_password@localhost:5432/cancerinfo_test
        run: |
          echo "=== 1. Upgrade PostgreSQL to Alembic Head ==="
          alembic upgrade head

          echo "=== 2. Automated Model-to-Migration Drift Check ==="
          alembic check

          echo "=== 3. Verify Schema is at Head Revision ==="
          python -c "from app.database.migration_check import verify_database_schema_at_head; from sqlalchemy import create_engine; import os; verify_database_schema_at_head(create_engine(os.environ['DATABASE_URL'])); print('Schema verified at Alembic Head.')"

          echo "=== 4. Validate-Only Dry-Run Mode ==="
          python scripts/bootstrap.py --validate-only

          echo "=== 5. Execute Controlled Bootstrap ==="
          python scripts/bootstrap.py

          echo "=== 6. Verify Repeated Bootstrap Refusal ==="
          if python scripts/bootstrap.py; then
            echo "ERROR: Repeated bootstrap should have refused!"
            exit 1
          else
            echo "Confirmed: Repeated bootstrap refused safely."
          fi

      - name: Validate Docker container portability, endpoints & durability
        run: |
          chmod +x scripts/validate_container.sh
          ./scripts/validate_container.sh
