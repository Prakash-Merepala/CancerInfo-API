version: "3.8"

services:
  cancerinfo-api:
    build: .
    container_name: cancerinfo_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./cancerinfo.db
    volumes:
      - cancerinfo_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  cancerinfo_data:
