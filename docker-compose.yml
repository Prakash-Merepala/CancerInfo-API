version: "3.8"

services:
  cancerinfo-api:
    build: .
    container_name: cancerinfo_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/data/cancerinfo.db
    volumes:
      - cancerinfo_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-3000}/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  cancerinfo_data:
