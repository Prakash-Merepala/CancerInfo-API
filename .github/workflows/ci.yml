name: CI / Quality & Compliance Pipeline

on:
  push:
    branches: ["main", "master", "fix/CIAPI-L*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-verify:
    name: Python 3.11 Runtime, Quality & OpenAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Clean repository checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 from .python-version
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Verify Python version
        run: |
          python --version

      - name: Install dependencies from committed reproducible lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --require-hashes -r requirements.txt

      - name: Verify dependency graph consistency
        run: |
          python -m pip check

      - name: Run pytest test suite with warnings visible
        run: |
          python -m pytest tests/ -v -ra -W default

      - name: Validate OpenAPI schema generation smoke test
        run: |
          python -c "from app.main import app; import json; spec = app.openapi(); print(f'OpenAPI OK: {len(spec[\"paths\"])} routes generated successfully.')"

      - name: Validate Docker container portability, endpoints & durability
        run: |
          chmod +x scripts/validate_container.sh
          ./scripts/validate_container.sh
